<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 — 仓库管理系统</title>
    <!-- Bootstrap 5 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: url('/static/page.png') no-repeat center center;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            margin-right: 300px;
            margin-left: 16px;
        }
        /* 移动端：居中 */
        @media (max-width: 768px) {
            body { justify-content: center; }
            .login-card {
                margin-right: 16px;
                margin-left: 16px;
            }
        }
        @media (max-width: 480px) {
            .login-card {
                padding: 24px;
            }
            .login-card .logo h2 {
                font-size: 1.3rem;
            }
        }
        .login-card .logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-card .logo i {
            font-size: 3rem;
            color: #4fc3f7;
        }
        .login-card .logo h2 {
            font-weight: 700;
            color: #1a1f36;
            margin-top: 8px;
        }
        .login-card .form-control {
            border-radius: 8px;
            padding: 10px 14px;
        }
        .login-card .btn-login {
            border-radius: 8px;
            padding: 10px;
            font-weight: 600;
            font-size: 1rem;
        }
        .login-footer {
            text-align: center;
            margin-top: 20px;
            color: #8a99a8;
            font-size: .85rem;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="logo">
        <img src="/static/icon.png" alt="icon" style="width:48px;height:48px;">
        <h2>仓库管理系统</h2>
        <small class="text-muted">Warehouse Management System</small>
    </div>

    <!-- Flash 消息 -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, msg in messages %}
    <div class="alert alert-{{ category }} alert-dismissible fade show mb-3" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold">用户名</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" name="username" class="form-control"
                       placeholder="请输入用户名" autocomplete="username"
                       autofocus required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">密码</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control"
                       placeholder="请输入密码" autocomplete="current-password"
                       required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary btn-login w-100">
            <i class="bi bi-box-arrow-in-right me-2"></i>登录
        </button>
    </form>
<!--
    <div class="login-footer">
        首次使用？默认账号：<strong>admin</strong> / <strong>admin123</strong>
    </div>
     -->
    
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
